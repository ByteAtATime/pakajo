[package]
name = "pakajo"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm = "5.0.2"
alpm-sys = { version = "5.0.1", default-features = false }
alpm-utils = "5.0.0"
pacmanconf = "3.1.0"
anyhow = "1.0.103"
regex = "1.12.4"
libc = "0.2"
nix = { version = "0.31", features = ["term"] }
signal-hook = { version = "0.3", features = ["iterator"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aur-depends = { version = "5.0.0", default-features = false }
raur = { version = "7.0.0", default-features = false, features = ["async"] }
async-trait = "0.1"
bincode = { version = "2", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
flate2 = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tar = "0.4"
tempfile = "3"
srcinfo = "2.1.0"
wait-timeout = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inotify = { version = "0.11", default-features = false }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "dc1cf9f00cbe2902a52166492654bb9fee8a73d1", features = ["wgpu"] }
syntect = "5"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["filters", "redactions"] }

[features]
debug = ["libcosmic/debug"]

[[bench]]
name = "search"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
