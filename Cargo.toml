[package]
name = "pakajo"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm = "5.0.2"
alpm-utils = "5.0.0"
pacmanconf = "3.1.0"
anyhow = "1.0.103"
regex = "1.12.4"
libc = "0.2"
nix = { version = "0.31", features = ["term"] }
signal-hook = { version = "0.3", features = ["iterator"] }
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
flate2 = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tar = "0.4"
tempfile = "3"
srcinfo = "2.1.0"
wait-timeout = "0.2"
clap = { version = "4", features = ["derive"] }
inotify = { version = "0.11", default-features = false }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "dc1cf9f00cbe2902a52166492654bb9fee8a73d1", features = ["wgpu"] }

[dev-dependencies]
criterion = "0.8.2"

[features]
default = ["debug"]
debug = ["libcosmic/debug"]

[[bin]]
name = "pakajo"
path = "src/cosmic/main.rs"

[[bench]]
name = "search"
harness = false