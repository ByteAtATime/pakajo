name: CI

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # TODO: is this a good idea?
  SNAPSHOT_DATE: "2025/12/13"
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:69a7520c58d27f1b2ee52dd61f6496e632582616b89c7952865f56b44617772b
    steps:
      - name: Sync Arch Linux Archive snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$SNAPSHOT_DATE" > /etc/pacman.d/mirrorlist
          pacman --noconfirm -Syyuu --needed --disable-download-timeout
          pacman --noconfirm -S --needed --disable-download-timeout \
            base-devel git libglvnd libx11 libxcursor libxkbcommon libxi libxrandr \
            namcap pacman vulkan-icd-loader wayland

      - name: Assert libalpm.so.16
        run: |
          test -e /usr/lib/libalpm.so.16
          pkg-config --atleast-version=16.0.0 libalpm
          pacman -Qo /usr/lib/libalpm.so.16

      - name: Install Rust
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain stable

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/git
            /usr/local/cargo/registry
            /usr/local/rustup
          key: arch-${{ env.SNAPSHOT_DATE }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            arch-${{ env.SNAPSHOT_DATE }}-

      - name: Build
        shell: bash
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"

          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            manifest=$(awk -F'"' '/^name = "pakajo"/{f=1} f && /^version = /{print $2; exit}' Cargo.toml)
            test "$version" = "$manifest" || {
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
              exit 1
            }
          fi

          cargo build --release --locked

      - name: Build binary tarball
        shell: bash
        run: |
          ver=$(awk -F'"' '/^name = "pakajo"/{f=1} f && /^version = /{print $2; exit}' Cargo.toml)
          carch=$(uname -m)
          test -n "$ver" -a -n "$carch"

          root=$(mktemp -d)
          stage="$root/pakajo-v$ver-$carch"
          mkdir -p "$stage/resources" dist
          install -Dm755 target/release/pakajo "$stage/pakajo"
          install -Dm644 resources/pakajo.desktop "$stage/resources/pakajo.desktop"
          install -Dm644 resources/com.pakajo.policy "$stage/resources/com.pakajo.policy"

          tar --use-compress-program="zstd -T0 -19" -cf "dist/pakajo-v$ver-$carch.tar.zst" \
            -C "$root" "pakajo-v$ver-$carch"

          sha256sum "dist/pakajo-v$ver-$carch.tar.zst" | tee dist/sha256sums
          tar --zstd -tf "dist/pakajo-v$ver-$carch.tar.zst"

      - name: Lint
        shell: bash
        run: |
          annotate() {
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::warning title=namcap::$line"; done
          }
          namcap PKGBUILD PKGBUILD-bin 2>&1 | annotate || true

      - uses: actions/upload-artifact@v7
        with:
          name: pakajo
          path: dist
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pakajo
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pakajo-v*-x86_64.tar.zst
            dist/sha256sums
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
